# Advanced Multi-Coin Trading Bot Configuration

# Exchange Settings
exchanges:
  binance:
    api_key: "YOUR_BINANCE_API_KEY"
    secret: "YOUR_BINANCE_SECRET"
    sandbox: false
    rate_limit: 1200
    enable_test: true
  
  bybit:
    api_key: "YOUR_BYBIT_API_KEY"
    secret: "YOUR_BYBIT_SECRET"
    sandbox: false
    rate_limit: 120
    enable_test: true

  okx:
    api_key: "YOUR_OKX_API_KEY"
    secret: "YOUR_OKX_SECRET"
    passphrase: "YOUR_OKX_PASSPHRASE"
    sandbox: false
    rate_limit: 20
    enable_test: true

# Trading Pairs Configuration
trading_pairs:
  major_pairs:
    - "BTC/USDT"
    - "ETH/USDT"
    - "BNB/USDT"
    - "ADA/USDT"
    - "SOL/USDT"
  
  altcoins:
    - "MATIC/USDT"
    - "DOT/USDT"
    - "LINK/USDT"
    - "AVAX/USDT"
    - "ATOM/USDT"
  
  defi_tokens:
    - "UNI/USDT"
    - "AAVE/USDT"
    - "COMP/USDT"
    - "SUSHI/USDT"

# AI & Strategy Configuration
ai_settings:
  confidence_threshold: 0.75
  signal_strength_min: 0.65
  ml_model_retrain_hours: 24
  sentiment_weight: 0.3
  technical_weight: 0.5
  fundamental_weight: 0.2
  
  models:
    - lstm_price_prediction
    - transformer_sentiment
    - gradient_boosting_signals
    - neural_network_patterns

# Trading Strategies
strategies:
  scalping:
    enabled: true
    timeframes: ["1m", "5m"]
    max_position_time: 30  # minutes
    profit_target: 0.5  # %
    stop_loss: 0.3  # %
    confidence_threshold: 0.8
  
  swing_trading:
    enabled: true
    timeframes: ["1h", "4h"]
    max_position_time: 72  # hours
    profit_target: 3.0  # %
    stop_loss: 1.5  # %
    confidence_threshold: 0.7
  
  trend_following:
    enabled: true
    timeframes: ["4h", "1d"]
    max_position_time: 168  # hours (1 week)
    profit_target: 8.0  # %
    stop_loss: 4.0  # %
    confidence_threshold: 0.75
  
  mean_reversion:
    enabled: true
    timeframes: ["15m", "1h"]
    max_position_time: 6  # hours
    profit_target: 2.0  # %
    stop_loss: 1.0  # %
    confidence_threshold: 0.7

# Risk Management
risk_management:
  max_portfolio_risk: 0.02  # 2% of portfolio per trade
  max_daily_loss: 0.05  # 5% of portfolio per day
  max_open_positions: 10
  position_sizing_method: "kelly_criterion"
  correlation_limit: 0.7  # Max correlation between positions
  
  leverage:
    max_leverage: 3
    default_leverage: 1
    high_confidence_leverage: 2

# Market Condition Analysis
market_conditions:
  bull_market:
    rsi_range: [30, 70]
    trend_strength: 0.6
    volatility_max: 0.04
    strategies: ["trend_following", "swing_trading"]
  
  bear_market:
    rsi_range: [20, 50]
    trend_strength: -0.6
    volatility_max: 0.06
    strategies: ["mean_reversion", "scalping"]
  
  sideways_market:
    rsi_range: [40, 60]
    trend_strength: 0.2
    volatility_max: 0.03
    strategies: ["mean_reversion", "scalping"]

# Technical Indicators
indicators:
  trend:
    - ema_9
    - ema_21
    - ema_50
    - sma_200
    - macd
    - adx
  
  momentum:
    - rsi
    - stoch_rsi
    - cci
    - williams_r
    - mfi
  
  volatility:
    - bollinger_bands
    - atr
    - keltner_channels
  
  volume:
    - obv
    - vwap
    - volume_sma
    - a_d_line

# Notification Settings
notifications:
  telegram:
    enabled: true
    bot_token: "YOUR_TELEGRAM_BOT_TOKEN"
    chat_id: "YOUR_CHAT_ID"
  
  discord:
    enabled: false
    webhook_url: "YOUR_DISCORD_WEBHOOK"
  
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    email: "your_email@gmail.com"
    password: "your_app_password"

# Database Configuration
database:
  type: "sqlite"  # sqlite, postgresql, mongodb
  path: "data/trading_bot.db"
  backup_frequency: 24  # hours
  
# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  file_path: "logs/trading_bot.log"
  max_file_size: "100MB"
  backup_count: 5
  console_output: true

# Performance Settings
performance:
  max_cpu_usage: 80  # %
  max_memory_usage: 4  # GB
  data_retention_days: 90
  cleanup_frequency: 24  # hours