# Advanced Trading Bot Configuration
# Bu dosya botun tüm ayarlarını içerir

# =============================================================================
# EXCHANGE SETTINGS
# =============================================================================
exchanges:
  bybit:
    enabled: true
    api_key: ""  # Will be loaded from .env file (BYBIT_API_KEY)
    secret: ""  # Will be loaded from .env file (BYBIT_SECRET)
    sandbox: true  # Paper trading için true, live için false
    default_type: "spot"  # spot, future, option
    requests_per_second: 10
    timeout: 30
    
  binance:
    enabled: false
    api_key: ""
    secret: ""
    sandbox: true
    default_type: "spot"
    requests_per_second: 10
    timeout: 30
    
  okx:
    enabled: false
    api_key: ""
    secret: ""
    passphrase: ""
    sandbox: true
    default_type: "spot"
    requests_per_second: 10
    timeout: 30

# =============================================================================
# TRADING STRATEGIES
# =============================================================================
strategies:
  scalping:
    enabled: true
    weight: 0.25
    parameters:
      move_threshold: 0.005  # 0.5% price move
      stop_loss_pct: 0.002   # 0.2% stop loss
      take_profit_pct: 0.004 # 0.4% take profit
      max_position_time: 300 # 5 minutes max hold
      
  swing_trading:
    enabled: true
    weight: 0.35
    parameters:
      sma_short: 20
      sma_long: 50
      stop_loss_pct: 0.03    # 3% stop loss
      take_profit_pct: 0.06  # 6% take profit
      max_position_time: 86400 # 24 hours max hold
      
  trend_following:
    enabled: true
    weight: 0.25
    parameters:
      sma_short: 50
      sma_long: 100
      stop_loss_pct: 0.05    # 5% stop loss
      take_profit_pct: 0.10  # 10% take profit
      max_position_time: 259200 # 72 hours max hold
      
  mean_reversion:
    enabled: true
    weight: 0.15
    parameters:
      bollinger_period: 20
      bollinger_std: 2
      stop_loss_pct: 0.04    # 4% stop loss
      take_profit_pct: 0.02  # 2% take profit (back to mean)
      max_position_time: 43200 # 12 hours max hold

# =============================================================================
# RISK MANAGEMENT
# =============================================================================
risk_management:
  max_portfolio_risk: 0.02      # 2% maximum portfolio risk
  max_position_risk: 0.005      # 0.5% maximum position risk
  max_daily_loss: 0.05          # 5% maximum daily loss
  max_open_positions: 10        # Maximum number of open positions
  correlation_threshold: 0.7    # Maximum correlation between positions
  
  # Position sizing
  position_sizing_method: "kelly"  # kelly, fixed, percentage
  default_position_size: 0.01   # 1% of portfolio for fixed method
  
  # Kelly Criterion settings
  kelly:
    enabled: true
    win_rate: 0.55              # Historical win rate (55%)
    reward_risk_ratio: 1.5      # Average reward/risk ratio
    max_kelly_fraction: 0.25    # Maximum 25% of portfolio
    min_kelly_fraction: 0.001   # Minimum 0.1% of portfolio
    
  # Stop loss settings
  trailing_stop:
    enabled: true
    default_distance: 0.02      # 2% trailing distance
    
  # Circuit breakers
  circuit_breakers:
    enabled: true
    daily_loss_limit: 0.05      # Stop trading if 5% daily loss
    consecutive_losses: 5       # Stop after 5 consecutive losses
    drawdown_limit: 0.15        # Stop if 15% drawdown

# =============================================================================
# AI & MACHINE LEARNING
# =============================================================================
ai:
  enabled: true
  confidence_threshold: 0.7     # Minimum confidence for trades
  signal_strength_min: 0.65     # Minimum signal strength
  
  # Model settings
  models:
    ensemble_enabled: true
    retrain_days: 7             # Retrain models every 7 days
    models_to_use:
      - "gradient_boosting"
      - "random_forest"
      - "lstm"
      
  # Technical indicators
  indicators:
    rsi:
      enabled: true
      period: 14
      overbought: 70
      oversold: 30
      
    macd:
      enabled: true
      fast_period: 12
      slow_period: 26
      signal_period: 9
      
    bollinger_bands:
      enabled: true
      period: 20
      std_dev: 2
      
    moving_averages:
      enabled: true
      periods: [7, 20, 50, 100, 200]
      
    volume_indicators:
      enabled: true
      obv: true
      volume_sma: 20

# =============================================================================
# MARKET ANALYSIS
# =============================================================================
market_analysis:
  enabled: true
  update_interval: 300          # 5 minutes
  
  # Market condition detection
  trend_detection:
    short_period: 20
    medium_period: 50
    long_period: 100
    
  volatility_analysis:
    period: 14
    threshold_high: 0.8
    threshold_low: 0.3
    
  # Fear & Greed Index
  sentiment_analysis:
    enabled: true
    weight: 0.3
    
  # Market dominance
  dominance_analysis:
    enabled: true
    btc_dominance_threshold: 0.45

# =============================================================================
# LIVE DATA ENGINE
# =============================================================================
live_data:
  enabled: true
  
  # Data collection
  data_update_interval: 10      # seconds
  symbols: ["BTCUSDT", "ETHUSDT", "ADAUSDT", "BNBUSDT"]
  timeframes: ["1m", "5m", "1h"]
  
  # Analysis engine
  analysis_interval: 60         # seconds
  decision_cooldown: 300        # 5 minutes between decisions
  
  # WebSocket settings
  websocket:
    enabled: true
    timeout: 30
    reconnect_attempts: 5
    reconnect_delay: 10

# =============================================================================
# DATABASE
# =============================================================================
database:
  url: "sqlite:///data/trading_bot.db"
  pool_size: 20
  echo: false
  
  # WAL mode for better concurrency
  wal_mode: true
  
  # Data retention
  retention:
    market_data_days: 365       # Keep market data for 1 year
    trades_days: 730            # Keep trades for 2 years
    logs_days: 90               # Keep logs for 3 months

# =============================================================================
# NOTIFICATIONS
# =============================================================================
notifications:
  telegram:
    enabled: true
    bot_token: ""               # .env dosyasından alınacak
    chat_id: ""                 # .env dosyasından alınacak
    
  discord:
    enabled: false
    webhook_url: ""             # .env dosyasından alınacak
    
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    email: ""                   # .env dosyasından alınacak
    password: ""                # .env dosyasından alınacak

# =============================================================================
# MONITORING
# =============================================================================
monitoring:
  enabled: true
  check_interval: 60            # seconds
  
  # System thresholds
  cpu_threshold: 80             # %
  memory_threshold: 80          # %
  disk_threshold: 90            # %
  
  # Performance monitoring
  performance_tracking:
    enabled: true
    metrics_interval: 300       # 5 minutes
    
  # Alerts
  alerts:
    system_health: true
    trading_performance: true
    error_notifications: true

# =============================================================================
# LOGGING
# =============================================================================
logging:
  level: "DEBUG"                # DEBUG, INFO, WARNING, ERROR, CRITICAL
  file_path: "logs/trading_bot.log"
  max_bytes: 10485760           # 10MB
  backup_count: 5
  
  # Console logging
  console:
    enabled: true
    level: "INFO"
    
  # File logging
  file:
    enabled: true
    level: "DEBUG"
    
  # Performance logging
  performance:
    enabled: true
    file_path: "logs/performance.log"

# =============================================================================
# BACKTESTING
# =============================================================================
backtesting:
  initial_capital: 10000        # $10,000
  commission: 0.001             # 0.1% commission
  slippage: 0.0005              # 0.05% slippage
  
  # Data settings
  data_period_days: 180         # 6 months of data
  timeframe: "1h"
  
  # Optimization
  optimization:
    enabled: true
    parameter_ranges:
      scalping:
        move_threshold: [0.003, 0.005, 0.007, 0.010]
        stop_loss_pct: [0.002, 0.003, 0.005]
        take_profit_pct: [0.004, 0.006, 0.008]

# =============================================================================
# TRADING PAIRS
# =============================================================================
trading_pairs:
  # Major cryptocurrencies - High volume, stable
  major:
    - "BTCUSDT"
    - "ETHUSDT" 
    - "BNBUSDT"
    
  # Mid-cap altcoins - Good volume
  altcoins:
    - "ADAUSDT"
    - "SOLUSDT"
    - "MATICUSDT"
    - "DOTUSDT"
    - "LINKUSDT"
    
  # DeFi tokens - Higher volatility
  defi:
    - "AVAXUSDT"
    - "ATOMUSDT"
    - "UNIUSDT"
    - "AAVEUSDT"
    - "COMPUSDT"
    - "SUSHIUSDT"

# =============================================================================
# TRADING SETTINGS
# =============================================================================
trading:
  mode: "paper"                 # paper, live
  initial_capital: 10000        # Starting capital for paper trading
  
  # Default settings
  default_symbols: ["BTCUSDT", "ETHUSDT", "ADAUSDT", "BNBUSDT"]
  default_timeframe: "1h"
  
  # Order settings
  order_timeout: 30             # seconds
  order_retry_attempts: 3
  
  # Paper trading
  paper_trading:
    enabled: true
    initial_balance: 10000
    realistic_slippage: true
    realistic_fees: true

# =============================================================================
# SECURITY
# =============================================================================
security:
  # API rate limiting
  rate_limiting:
    enabled: true
    requests_per_second: 10
    
  # Encryption
  encryption:
    enabled: false              # Will be implemented if needed
    
  # IP whitelist (for exchange APIs)
  ip_whitelist:
    enabled: false              # Configure on exchange side

# =============================================================================
# DEVELOPMENT & DEBUG
# =============================================================================
development:
  debug_mode: false
  verbose_logging: false
  save_market_data: true        # Save market data for analysis
  simulation_mode: false        # Use simulated data instead of real API calls
  
  # Testing
  testing:
    mock_orders: false          # Use mock orders for testing
    mock_data: false            # Use mock market data
    fast_mode: false            # Speed up for testing