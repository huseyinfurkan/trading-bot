# Trading Bot Configuration
# Enhanced configuration with WebSocket, error handling, and performance monitoring

# Exchange Configuration
exchanges:
  bybit:
    enabled: true
    testnet: true  # Use testnet for safety
    api_key: ${BYBIT_API_KEY}
    api_secret: ${BYBIT_SECRET}
    params:
      testnet: true
      defaultType: 'spot'
  
  binance:
    enabled: false  # Disabled by default
    testnet: true
    api_key: ${BINANCE_API_KEY}
    api_secret: ${BINANCE_SECRET}
    params:
      testnet: true
      defaultType: 'spot'
  
  okx:
    enabled: false  # Disabled by default
    testnet: true
    api_key: ${OKX_API_KEY}
    api_secret: ${OKX_SECRET}
    passphrase: ${OKX_PASSPHRASE}
    params:
      testnet: true
      defaultType: 'spot'

# WebSocket Configuration
websocket:
  enabled: true
  max_reconnect_attempts: 5
  reconnect_delay: 10
  message_timeout: 300  # 5 minutes
  data_retention: 1000  # Keep last 1000 messages per symbol

# Trading Configuration
trading:
  mode: "paper"  # paper, live
  symbols:
    - "BTC/USDT"
    - "ETH/USDT"
    - "BNB/USDT"
    - "ADA/USDT"
  
  # Risk Management
  risk_management:
    max_portfolio_risk: 0.02  # 2% max portfolio risk
    max_position_risk: 0.01   # 1% max position risk
    max_daily_loss: 0.05      # 5% max daily loss
    max_open_positions: 10
    correlation_threshold: 0.7
    min_position_size: 10     # $10 minimum
    max_position_size: 10000  # $10,000 maximum
    
    # Position sizing methods
    position_sizing:
      method: "kelly"  # kelly, fixed, percentage
      kelly_fraction: 0.25
      fixed_amount: 100
      percentage: 0.02
    
    # Stop loss and take profit
    stop_loss:
      default_percentage: 0.02  # 2%
      trailing_enabled: true
      trailing_distance: 0.01   # 1%
    
    take_profit:
      default_percentage: 0.04  # 4%
      trailing_enabled: true
      trailing_distance: 0.005  # 0.5%

# Strategy Configuration
strategies:
  alligator_ma_momentum:
    enabled: true
    timeframe: "15m"
    description: "Williams Alligator + MA (Trend Following)"
    market_conditions: ["trending_market", "breakout_market"]
    weight: 0.6
  
  bollinger_rsi_stochrsi:
    enabled: true
    timeframe: "5m"
    description: "BB + RSI + Stochastic RSI (Mean Reversion)"
    market_conditions: ["sideways_market", "consolidation_market", "ranging_market"]
    weight: 0.4

# Strategy Parameters
strategy_parameters:
  alligator_ma_momentum:
    # Williams Alligator
    jaw_period: 13
    jaw_shift: 8
    teeth_period: 8
    teeth_shift: 5
    lips_period: 5
    lips_shift: 3
    
    # Moving Averages
    sma_200: 200
    fast_sma: 10
    slow_sma: 20
    max_hold_bars: 12
    
    # Exit Strategy
    profit_target: 0.08
    stop_loss: 0.025
    risk_per_trade: 0.02
    leverage: 2.0
    
    # Advanced Exit
    trailing_stop_enabled: true
    trailing_stop_activation: 0.03
    trailing_stop_distance: 0.015
    volatility_stop_enabled: true
    atr_stop_multiplier: 2.0
    
    # Optimization ranges
    optimization_ranges:
      fast_sma: [8, 12, 15]
      slow_sma: [15, 20, 25]
      profit_target: [0.06, 0.08, 0.10]
      stop_loss: [0.02, 0.025, 0.03]
  
  bollinger_rsi_stochrsi:
    # Bollinger Bands
    bb_period: 20
    bb_std_dev: 2.0
    
    # RSI
    rsi_period: 14
    rsi_oversold: 30
    rsi_overbought: 70
    
    # Stochastic RSI
    stochrsi_period: 14
    stochrsi_oversold: 20
    stochrsi_overbought: 80
    max_hold_bars: 6
    
    # Exit Strategy
    profit_target: 0.04
    stop_loss: 0.012
    risk_per_trade: 0.015
    leverage: 1.8
    
    # Advanced Exit
    trailing_stop_enabled: true
    trailing_stop_activation: 0.02
    trailing_stop_distance: 0.008
    volatility_stop_enabled: true
    atr_stop_multiplier: 1.5
    
    # Optimization ranges
    optimization_ranges:
      bb_std_dev: [1.8, 2.0, 2.2]
      rsi_oversold: [25, 30, 35]
      rsi_overbought: [65, 70, 75]
      profit_target: [0.03, 0.04, 0.05]

# Parameter Optimization
parameter_optimization:
  enabled: true
  interval_hours: 24
  optimization_method: "grid_search"
  max_combinations: 10
  validation_period_days: 7

# AI Configuration
ai:
  confidence_threshold: 0.6
  retrain_frequency_hours: 24
  model_validation:
    enabled: true
    min_accuracy: 0.6
    min_f1_score: 0.5
  
  # Signal weights
  signal_weights:
    technical: 0.35
    ml: 0.35
    volume: 0.2
    regime: 0.1

# Market Analysis
market_analysis:
  timeframes: ["15m", "1h", "4h"]
  symbols_for_regime: ["BTC/USDT", "ETH/USDT", "BNB/USDT"]
  volatility_threshold: 0.8
  trend_strength_threshold: 0.7

# Live Data Engine
live_data:
  analysis_interval: 60  # seconds
  decision_cooldown: 300  # seconds
  data_retention_hours: 24
  cache_ttl: 300  # 5 minutes
  
  # Dynamic intervals
  dynamic_intervals:
    enabled: true
    volatility_multiplier: 0.5
    trend_multiplier: 0.8
    normal_multiplier: 1.2

# Error Handling
error_handling:
  circuit_breaker:
    failure_threshold: 5
    recovery_timeout: 60
    success_threshold: 2
  
  error_thresholds:
    low: 10
    medium: 5
    high: 3
    critical: 1
  
  alerts:
    enabled: true
    cooldown_seconds: 300

# Performance Monitoring
performance_monitoring:
  enabled: true
  monitoring_interval: 60  # seconds
  retention_hours: 24
  max_metrics_count: 1000
  
  thresholds:
    cpu_usage: 80
    memory_usage: 80
    disk_usage: 90
    response_time: 5.0
    error_rate: 0.1
  
  alert_cooldown: 300  # 5 minutes

# Database Configuration
database:
  path: "data/trading_bot.db"
  pool_size: 20
  retention_days: 30
  
  # Performance settings
  pragma:
    journal_mode: "WAL"
    synchronous: "NORMAL"
    temp_store: "MEMORY"
    mmap_size: 268435456  # 256MB
    cache_size: 10000
    page_size: 4096

# Logging Configuration
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name}:{function}:{line} | {message}"
  rotation: "1 day"
  retention: "30 days"
  
  # File logging
  file:
    enabled: true
    path: "logs/trading_bot.log"
    max_size: "10 MB"
  
  # Console logging
  console:
    enabled: true
    colorize: true

# Notifications
notifications:
  telegram:
    enabled: false
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}
  
  discord:
    enabled: false
    webhook_url: ${DISCORD_WEBHOOK_URL}
  
  email:
    enabled: false
    smtp_host: ${EMAIL_SMTP_HOST}
    smtp_port: ${EMAIL_SMTP_PORT}
    from_email: ${EMAIL_FROM}
    password: ${EMAIL_PASSWORD}
    to_email: ${EMAIL_TO}

# Backtesting Configuration
backtesting:
  enabled: true
  start_date: "2024-01-01"
  end_date: "2024-12-31"
  initial_capital: 10000
  trading_fee: 0.001
  
  # Performance metrics
  metrics:
    - "total_return"
    - "sharpe_ratio"
    - "max_drawdown"
    - "win_rate"
    - "profit_factor"
    - "calmar_ratio"

# Security Configuration
security:
  api_key_encryption: false  # Enable for production
  sensitive_data_masking: true
  audit_logging: true
  
  # Rate limiting
  rate_limits:
    requests_per_second: 5
    requests_per_minute: 300
    requests_per_hour: 18000

# Development Configuration
development:
  debug_mode: false
  save_market_data: true
  simulation_mode: true
  
  # Testing
  testing:
    enabled: false
    test_symbols: ["BTC/USDT"]
    test_timeframe: "1h"
    test_duration_hours: 24